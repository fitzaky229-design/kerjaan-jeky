<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}

header.atas{position:sticky;top:0;z-index:20;background:var(--h);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:54px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
header .judul{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-ikon{background:none;border:0;color:inherit;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}

.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--g);border-left:4px solid #CFD8DC;border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}

.progress{height:10px;background:#ECEFF1;border-radius:99px;overflow:hidden;margin:8px 0}

.kosong{text-align:center;color:var(--t2);padding:22px 10px;font-size:14px}

.gps{border:1px dashed #B0BEC5;border-radius:10px;padding:10px;margin-bottom:12px;background:#FAFAFA}
.tahap{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--g);cursor:pointer}
.tahap:last-child{border-bottom:0}
.tahap .dot{width:14px;height:14px;border-radius:50%;margin-top:4px;flex:none;background:#CFD8DC}
.dot.hijau{background:var(--h)}.dot.merah{background:var(--m)}.dot.oranye{background:var(--o)}
.tahap .utama{flex:1}
.editor-baris{display:grid;grid-template-columns:1fr 84px 38px;gap:6px;margin-bottom:6px;align-items:center}
.editor-field{border:1px solid var(--g);border-radius:10px;padding:8px;margin-bottom:8px}

.hitung{background:var(--h3);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}

.login h1{margin:6px 0 2px;font-size:22px;color:var(--h2)}
.login .logo{width:56px;height:56px;border-radius:14px;background:var(--h3);display:grid;place-items:center;font-size:30px}
.login .pesan{background:var(--o2);color:#BF360C;padding:10px;border-radius:8px;font-size:13.5px;margin:12px 0}
.login .salah{color:var(--m);font-size:13.5px;margin-top:10px;min-height:1em}
.memuat{min-height:100vh;display:grid;place-items:center;color:var(--t2)}
@media (min-width:600px){.stat .n{font-size:26px}}

<body>

<script>
'use strict';
/* ====================== UTILITAS ====================== */
const TABEL = ['Petani', 'Komoditas', 'Tanam', 'Inspeksi', 'Taksasi', 'Panen', 'Foto'];
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const BULAN_P = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.from((el || document).querySelectorAll(s)); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function on(fn, ...args) { return 'onclick="' + esc(fn + '(' + args.map(a => JSON.stringify(a === undefined ? null : a)).join(',') + ')') + '"'; }
function onSubmit(fn, ...args) { return 'onsubmit="' + esc(fn + '(event' + args.map(a => ',' + JSON.stringify(a === undefined ? null : a)).join('') + ')') + '"'; }
function pad(n) { return String(n).padStart(2, '0'); }
function hariIni() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function keUTC(s) { const p = String(s).slice(0, 10).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
function tambahHari(s, n) { return s ? new Date(keUTC(s) + Number(n || 0) * 86400000).toISOString().slice(0, 10) : ''; }
function selisih(a, b) { return Math.round((keUTC(b) - keUTC(a)) / 86400000); }
function fmtTgl(s) { if (!s) return '-'; const p = String(s).slice(0, 10).split('-').map(Number); if (!p[0] || !p[1]) return '-'; return p[2] + ' ' + BULAN[p[1] - 1] + ' ' + p[0]; }
function fmtTglPanjang(s) { const p = s.split('-').map(Number); const dt = new Date(p[0], p[1] - 1, p[2]); return HARI[dt.getDay()] + ', ' + p[2] + ' ' + BULAN_P[p[1] - 1] + ' ' + p[0]; }
function fmtAngka(n, dec) { if (n === null || n === undefined || n === '' || isNaN(n)) return '-'; return Number(n).toLocaleString('id-ID', { maximumFractionDigits: dec === undefined ? 2 : dec }); }
function fmtKoord(n) { return n === null || n === undefined || n === '' ? '-' : Number(n).toFixed(6); }
function jumlah(arr) { return arr.reduce((a, b) => a + (Number(b) || 0), 0); }
function angka(v) { if (v === '' || v === null || v === undefined) return null; const n = Number(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
function labelSelisih(n) { if (n < 0) return 'Terlewat ' + (-n) + ' hari'; if (n === 0) return 'Hari ini'; if (n === 1) return 'Besok'; return 'H-' + n; }
function warnaSelisih(n, jendela) { return n < 0 ? 'merah' : (n <= jendela ? 'oranye' : ''); }
function urutTglTurun(a, b) { return String(b.tanggal || '').localeCompare(String(a.tanggal || '')); }
function nextKode(arr, prefix, lebar) {
  let maks = 0;
  arr.forEach(o => { const k = String(o.kode || ''); if (k.indexOf(prefix) === 0) { const n = parseInt(k.slice(prefix.length), 10); if (!isNaN(n) && n > maks) maks = n; } });
  return prefix + String(maks + 1).padStart(lebar || 3, '0');
}
function salam() { const h = new Date().getHours(); return h < 11 ? 'pagi' : h < 15 ? 'siang' : h < 18 ? 'sore' : 'malam'; }
function maps(lat, lng) { return 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng; }
function nomorWa(hp) { let s = String(hp || '').replace(/\D/g, ''); if (!s) return ''; if (s[0] === '0') s = '62' + s.slice(1); else if (s[0] === '8') s = '62' + s; return s; }

const IK = {
  kembali: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  beranda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  jadwal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  petani: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2 .9 3.2 3 3.5 5.7"/></svg>',
  laporan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  pengaturan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
const NAMA_TAB = { beranda: 'Beranda', jadwal: 'Jadwal', petani: 'Petani', laporan: 'Laporan', pengaturan: 'Pengaturan' };

/* ====================== PENYIMPANAN DI HP ====================== */
const Simpan = {
  db: null, mem: { kv: {}, antre: {}, foto: {} },
  async buka() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('aplikasi-fi-benih', 1);
        r.onupgradeneeded = () => { ['kv', 'antre', 'foto'].forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) {
      this.db = null;
      try { const s = localStorage.getItem('aplikasi-fi-benih'); if (s) this.mem = JSON.parse(s); } catch (e2) { /* abaikan */ }
    }
  },
  _memSimpan() { try { localStorage.setItem('aplikasi-fi-benih', JSON.stringify(this.mem)); } catch (e) { /* penuh */ } },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  async get(store, key) { if (!this.db) return this.mem[store][key]; return this.tx(store, 'readonly', s => s.get(key)); },
  async set(store, key, val) { if (!this.db) { this.mem[store][key] = val; this._memSimpan(); return; } return this.tx(store, 'readwrite', s => s.put(val, key)); },
  async del(store, key) { if (!this.db) { delete this.mem[store][key]; this._memSimpan(); return; } return this.tx(store, 'readwrite', s => s.delete(key)); },
  async semua(store) { if (!this.db) return Object.values(this.mem[store]); return this.tx(store, 'readonly', s => s.getAll()); }
};

/* ====================== STATE & DATA ====================== */
const S = {
  server: null, token: null, snap: null, antre: [], fotoLokal: {}, online: true, sinkron: false, terakhir: null,
  stack: [], cache: null, fotoCache: {}, form: null, mulai: false,
  filter: { jadwalKom: '', lapKom: '', lapTahun: '', cariPetani: '' }
};

function data() {
  if (S.cache) return S.cache;
  const d = {};
  TABEL.forEach(n => { d[n] = ((S.snap && S.snap[n]) || []).map(o => Object.assign({}, o)); });
  d.pengaturan = Object.assign({ jendela: 7 }, (S.snap && S.snap.pengaturan) || {});
  S.antre.forEach(op => {
    if (op.jenis === 'setting') { d.pengaturan[op.key] = op.value; return; }
    const arr = d[op.tabel];
    if (!arr) return;
    const id = op.jenis === 'hapus' ? op.id : op.data.id;
    const i = arr.findIndex(x => x.id === id);
    if (op.jenis === 'hapus') { if (i >= 0) arr.splice(i, 1); return; }
    if (i >= 0) Object.assign(arr[i], op.data, { _pending: true });
    else arr.push(Object.assign({}, op.data, { _pending: true }));
  });
  const adaFoto = new Set(d.Foto.map(f => f.id));
  Object.values(S.fotoLokal).forEach(f => {
    if (!adaFoto.has(f.id) && !f.dihapus) d.Foto.push({ id: f.id, inspeksiId: f.inspeksiId, kodeTanam: f.kodeTanam, fileId: f.fileId || '', lokal: true });
  });
  d.by = {};

function tahapTanam(t, d) {
  const k = d.by.Komoditas[t.komoditasId];
  if (!k || !t.tglTanam) return [];
  const ins = d.Inspeksi.filter(x => x.tanamId === t.id);
  const pan = d.Panen.filter(x => x.tanamId === t.id);
  const out = [];
  if (t.tglTanam > hariIni()) out.push({ nama: 'Tanam', jenis: 'tanam', tanggal: t.tglTanam, selesai: false });
  (k.tahap || []).forEach(s => {
    const ref = ins.filter(x => x.tahap === s.nama).sort(urutTglTurun)[0];
    out.push({ nama: s.nama, jenis: 'inspeksi', tanggal: tambahHari(t.tglTanam, s.hst), hst: s.hst, selesai: !!ref, ref: ref });
  });
  out.push({ nama: 'Panen', jenis: 'panen', tanggal: tambahHari(t.tglTanam, k.hstPanen), hst: k.hstPanen, selesai: pan.length > 0, ref: pan[0] });
  return out;
}
function agenda(d, komId) {
  const hari = hariIni(), res = [];
  d.Tanam.filter(t => t.status === 'Aktif' && (!komId || t.komoditasId === komId)).forEach(t => {
    tahapTanam(t, d).filter(s => !s.selesai).forEach(s => res.push({ t: t, s: s, tanggal: s.tanggal, selisih: selisih(hari, s.tanggal) }));
  });
  return res.sort((a, b) => a.tanggal.localeCompare(b.tanggal));
}
function berikutnya(t, d) {
  const s = tahapTanam(t, d).find(x => !x.selesai);
  return s ? { s: s, selisih: selisih(hariIni(), s.tanggal) } : null;
}
function capaian(t, d) {
  const taks = d.Taksasi.filter(x => x.tanamId === t.id).sort(urutTglTurun)[0];
  const pan = d.Panen.filter(x => x.tanamId === t.id);
  const target = angka(t.target);
  const hasil = angka(t.benihBersih);
  const est = taks ? angka(taks.estimasi) : null;
  const pct = target && hasil !== null ? hasil / target * 100 : null;
  const pctEst = target && est !== null ? est / target * 100 : null;
  const status = hasil !== null ? (target ? (pct >= 100 ? 'Tercapai' : 'Belum tercapai') : 'Selesai') : 'Menunggu hasil';
  return { target: target, est: est, pctEst: pctEst, totalPanen: jumlah(pan.map(p => p.berat)), jmlPanen: pan.length, hasil: hasil, pct: pct, status: status, taks: taks };
}

const MODE_GAS = !!(window.google && google.script && google.script.run);
function errOffline(pesan) { const e = new Error(pesan); e.offline = true; return e; }
function prosesHasil(r) {
  if (!r || typeof r !== 'object') throw new Error('Respons server tidak valid');
  if (r.ok) return r.data;
  if (r.error === 'SESI_HABIS') { const e = new Error('Sesi berakhir, silakan login lagi'); e.sesi = true; sesiHabis(); throw e; }
  throw new Error(r.error);
}
/* Mode 1: aplikasi dibuka dari link Apps Script */
function panggilGas(fn, args) {
  return new Promise((res, rej) => {
    let selesai = false;
    const batas = setTimeout(() => { if (selesai) return; selesai = true; rej(errOffline('Waktu habis, sinyal lemah')); }, 120000);
    google.script.run
      .withSuccessHandler(r => { if (selesai) return; selesai = true; clearTimeout(batas); res(r); })
      .withFailureHandler(err => { if (selesai) return; selesai = true; clearTimeout(batas); rej(errOffline('Tidak dapat terhubung: ' + String((err && err.message) || err))); })[fn](...args);
  });
}
/* Mode 2: aplikasi terpasang (GitHub Pages) memanggil server Apps Script lewat internet */
async function panggilServer(fn, args, url) {
  url = url || S.server;
  if (!url) throw new Error('Link server belum diatur');
  if (navigator.onLine === false) throw errOffline('Tidak ada sinyal');
  const ctrl = window.AbortController ? new AbortController() : null;
  const batas = setTimeout(() => { if (ctrl) ctrl.abort(); }, 120000);
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow', signal: ctrl ? ctrl.signal : undefined });
  } catch (e) {
    throw errOffline('Tidak dapat terhubung ke server');
  } finally {
    clearTimeout(batas);
  }
  const teks = await res.text().catch(() => '');
  try { return JSON.parse(teks); }
  catch (e) { throw new Error('Server tidak membalas dengan benar. Pastikan link berakhiran /exec dan akses deployment "Siapa saja".'); }
}
async function panggil(fn, ...args) {
  const r = MODE_GAS ? await panggilGas(fn, args) : await panggilServer(fn, args);
  return prosesHasil(r);
}

let timerSinkron = null;
function jadwalSinkron(ms) { clearTimeout(timerSinkron); timerSinkron = setTimeout(() => sinkron(false), ms === undefined ? 800 : ms); }

async function sinkron(manual) {
  if (!S.token) return;
  if (S.sinkron) { if (manual) toast('Sedang menyinkron…'); return; }
  S.sinkron = true;
  renderStatus();
  try {
    const ops = S.antre.slice();
    const kirim = ops.map(o => ({ opId: o.opId, jenis: o.jenis, tabel: o.tabel, id: o.id, data: o.data, key: o.key, value: o.value }));
    const r = await panggil('apiSync', S.token, kirim);
    const terkirim = new Set(ops.map(o => o.opId));
    S.antre = S.antre.filter(o => !terkirim.has(o.opId));
    for (const o of ops) await Simpan.del('antre', o.opId);
    (r.hasil || []).forEach(h => {
      if (!h.ok) toast('Gagal disimpan di server: ' + h.pesan, 'error', 8000);
      else if (h.pesan) toast(h.pesan, 'info', 7000);
    });
    await setSnap(r.data);
    S.online = true;
    const tunggu = Object.values(S.fotoLokal).filter(f => !f.terkirim && !f.dihapus);
    let n = 0;
    for (const f of tunggu) {
      n++;
      renderStatus('Mengirim foto ' + n + '/' + tunggu.length + '…');
      const h = await panggil('apiUploadFoto', S.token, { id: f.id, inspeksiId: f.inspeksiId, kodeTanam: f.kodeTanam, data: f.data });
      f.terkirim = true;
      f.fileId = h.fileId;
      delete f.data;
      await Simpan.set('foto', f.id, f);
    }
    if (tunggu.length) await setSnap(await panggil('apiAmbil', S.token));
    S.terakhir = new Date();
    if (manual) toast('✓ Semua data sudah tersinkron', 'ok');
  } catch (e) {
    if (e.offline) {
      S.online = false;
      if (manual) toast('Tidak ada sinyal. Data aman di HP dan dikirim otomatis saat ada sinyal.', 'warn', 6000);
    } else if (!e.sesi) {
      toast(e.message, 'error', 7000);
    }
  } finally {
    S.sinkron = false;
    S.cache = null;
    if (S.token && S.mulai) { renderStatus(); renderUlang(); }
  }
}

function muatFotoLazy() {
  $$('img[data-file]').forEach(img => {

}

function gpsWidget(lat, lng, label, auto) {
  const ada = lat !== null && lat !== undefined && lat !== '';
  return '<div class="gps" data-auto="' + (auto ? 1 : 0) + '"><div class="row-between" style="align-items:center"><div><div class="lbl">' + esc(label) + '</div><div class="muted gps-teks">' + (ada ? fmtKoord(lat) + ', ' + fmtKoord(lng) : 'Belum ada koordinat') + '</div></div>' +
    '<button type="button" class="btn kecil dua" onclick="ambilGps(this)">📍 Ambil</button></div>' +
    '<div class="grid2" style="margin-top:8px"><input name="lat" placeholder="Latitude" inputmode="decimal" value="' + esc(ada ? lat : '') + '"><input name="lng" placeholder="Longitude" inputmode="decimal" value="' + esc(ada ? lng : '') + '"></div>' +
    '<div class="hint">Tekan “Ambil” saat berada di lokasi. GPS tetap bisa dipakai tanpa sinyal internet.</div></div>';
}
function ambilGps(btn, diam) {
  const box = btn.closest('.gps'), teks = $('.gps-teks', box);
  if (!navigator.geolocation) { if (!diam) toast('Browser tidak mendukung GPS. Isi koordinat manual.', 'warn'); return; }
  teks.textContent = 'Mencari lokasi… (pastikan Lokasi/GPS HP aktif)';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    const c = pos.coords;
    $('[name=lat]', box).value = c.latitude.toFixed(6);
    $('[name=lng]', box).value = c.longitude.toFixed(6);
    teks.textContent = c.latitude.toFixed(6) + ', ' + c.longitude.toFixed(6) + ' (akurasi ±' + Math.round(c.accuracy) + ' m)';
    btn.disabled = false;
  }, err => {
    btn.disabled = false;
    teks.textContent = 'Lokasi belum didapat';
    if (!diam) toast(err.code === 1 ? 'Izin lokasi ditolak. Izinkan akses lokasi di browser, atau ketik koordinat manual.' : err.code === 2 ? 'Sinyal GPS tidak ditemukan. Coba di tempat terbuka.' : 'Waktu mencari GPS habis. Coba tekan Ambil lagi.', 'warn', 7000);
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 60000 });
}

function bacaFile(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
async function kompres(file) {
  const url = await bacaFile(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak bisa dibaca')); i.src = url; });
  const buat = (maks, q) => {
    const s = Math.min(1, maks / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s);
    c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  let hasil = buat(1280, 0.72);
  if (hasil.length > 420000) hasil = buat(1024, 0.62);
  return { data: hasil, thumb: buat(320, 0.6) };
}

async function simpanKomoditas(e, id) {

  const form = e.target, f = ambilForm(form), d = data();

  if (!/^[A-Z0-9]{2,6}$/.test(kode)) { toast('Kode 2–6 huruf/angka tanpa spasi, mis. CBI', 'error'); return; }
  if (d.Komoditas.some(k => k.id !== id && k.kode === kode)) { toast('Kode ' + kode + ' sudah dipakai', 'error'); return; }
  const tahap = [];
  for (const r of $$('[data-tahap]', form)) {
    const nama = $('[data-k=nama]', r).value.trim(), hst = angka($('[data-k=hst]', r).value);
    if (!nama && hst === null) continue;

    tahap.push({ nama: nama, hst: hst });
  }
  const namaUnik = new Set(tahap.map(t => t.nama));
  if (namaUnik.size !== tahap.length) { toast('Nama tahap tidak boleh sama', 'error'); return; }
  tahap.sort((a, b) => a.hst - b.hst);
  const fields = [];
  for (const r of $$('[data-field]', form)) {

  }
  const hstPanen = angka(f.hstPanen);
  if (!hstPanen) { toast('Isi HST perkiraan panen', 'error'); return; }
  await simpanRec('Komoditas', { id: id || uuid(), kode: kode, nama: f.nama, tahap: tahap, hstPanen: hstPanen, fields: fields, aktif: !!f.aktif });

  kembali();
}

function htmlInspeksiPdf(i, d) {
  const ex = i.extra || {};
  return tabelInfo([['Tahap', i.tahap], ['Tanggal', fmtTgl(i.tanggal)], ['Jarak isolasi', i.isolasi], ['Off-type dicabut', fmtAngka(i.offtype, 0)], ['Hama / penyakit', (i.hama || '-') + ' (' + (i.tingkatHama || '-') + ')'], ['Kondisi tanaman', i.kondisi]]
    .concat(Object.keys(ex).map(k => [k, ex[k]]))
    .concat([['Hasil inspeksi', i.hasil], ['Catatan & rekomendasi', i.catatan], ['Koordinat', i.lat !== null && i.lat !== undefined && i.lat !== '' ? fmtKoord(i.lat) + ', ' + fmtKoord(i.lng) : '-']]));
}
async function buatPdf(judul, html) {
  const m = modal('<div class="h2">Membuat PDF…</div><p class="muted">Mohon tunggu. Pembuatan PDF butuh sinyal internet.</p>', true);
  try {
    const r = await panggil('apiPdf', S.token, judul, html);
    m.isi('<div class="h2">PDF siap ✅</div><p class="muted">' + esc(r.nama) + ' tersimpan di Google Drive, folder “Kerjaan Jeky - Laporan PDF”. Dari sana bisa dibagikan ke WhatsApp.</p><div class="baris-btn" style="justify-content:flex-end"><button class="btn dua" onclick="tutupModal()">Tutup</button><a class="btn" href="' + esc(r.url) + '" target="_blank" onclick="setTimeout(tutupModal,300)">Buka PDF</a></div>');
  } catch (e) {
    m.isi('<div class="h2">PDF belum bisa dibuat</div><p>' + (e.offline ? 'Tidak ada sinyal. Coba lagi setelah ada sinyal.' : esc(e.message)) + '</p><div class="baris-btn" style="justify-content:flex-end"><button class="btn dua" onclick="tutupModal()">Tutup</button></div>');
  }
}
function pdfInspeksi(id) {
  const d = data(), i = d.by.Inspeksi[id];
  if (!i) return;
  const t = d.by.Tanam[i.tanamId] || {}, p = d.by.Petani[t.petaniId] || {};
  const foto = d.Foto.filter(f => f.inspeksiId === id);
  const isi = '<h2>Data tanam</h2>' + tabelInfo([['Kode tanam', t.kode], ['Petani', (p.nama || t.namaPetani || '-') + ' (' + (p.kode || t.kodePetani || '-') + ')'], ['Alamat', [p.desa, p.kecamatan, p.kabupaten].filter(Boolean).join(', ')], ['Komoditas / varietas', namaKom(t, d) + ' / ' + (t.varietas || '-')], ['Luas', fmtAngka(t.luas) + ' ha'], ['Tanggal tanam', fmtTgl(t.tglTanam)]]) +
    '<h2>Hasil inspeksi</h2>' + htmlInspeksiPdf(i, d) +
    (foto.length ? '<h2>Foto</h2><div>' + foto.map(imgPdf).join('') + '</div>' : '');
  buatPdf('Inspeksi ' + (t.kode || '') + ' - ' + i.tahap + ' - ' + fmtTgl(i.tanggal), bungkusPdf('Laporan Inspeksi Lapangan', isi));
}
function pdfPetani(id) {
  const d = data(), p = d.by.Petani[id];
  if (!p) return;
  const tanam = d.Tanam.filter(t => t.petaniId === id).sort((a, b) => String(a.tglTanam || '').localeCompare(String(b.tglTanam || '')));
  let isi = '<h2>Data petani</h2>' + tabelInfo([['Kode', p.kode], ['Nama', p.nama], ['No. HP / WA', p.hp], ['Alamat', [p.desa, p.kecamatan, p.kabupaten].filter(Boolean).join(', ')], ['Status', p.status], ['Catatan', p.catatan]]);
  isi += '<h2>Ringkasan tanam</h2>' + (tanam.length ? '<table><tr><th>Kode tanam</th><th>Komoditas</th><th>Tgl tanam</th><th class="kanan">Luas (ha)</th><th class="kanan">Target (kg)</th><th class="kanan">Benih bersih (kg)</th><th class="kanan">Capaian</th><th>Status</th></tr>' +
    tanam.map(t => { const c = capaian(t, d); return '<tr><td>' + esc(t.kode) + '</td><td>' + esc(namaKom(t, d)) + '</td><td>' + fmtTgl(t.tglTanam) + '</td><td class="kanan">' + fmtAngka(t.luas) + '</td><td class="kanan">' + fmtAngka(c.target) + '</td><td class="kanan">' + fmtAngka(c.hasil) + '</td><td class="kanan">' + (c.pct !== null ? fmtAngka(c.pct, 0) + '%' : '-') + '</td><td>' + esc(t.status) + '</td></tr>'; }).join('') + '</table>' : '<p>Belum ada data tanam.</p>');
  tanam.forEach(t => {
    const ins = d.Inspeksi.filter(x => x.tanamId === t.id).sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));
    const pan = d.Panen.filter(x => x.tanamId === t.id).sort((a, b) => (a.panenKe || 0) - (b.panenKe || 0));
    const c = capaian(t, d);
    isi += '<h2>' + esc(t.kode) + ' — ' + esc(namaKom(t, d)) + (t.varietas ? ' (' + esc(t.varietas) + ')' : '') + '</h2>' +
      '<div>Tanam ' + fmtTgl(t.tglTanam) + ' · ' + fmtAngka(t.luas) + ' ha · Target ' + fmtAngka(c.target) + ' kg · Taksasi ' + fmtAngka(c.est) + ' kg · Total panen ' + fmtAngka(c.totalPanen) + ' kg · Benih bersih ' + fmtAngka(c.hasil) + ' kg</div>' +
      '<h3>Inspeksi</h3>' + (ins.length ? '<table><tr><th>Tanggal</th><th>Tahap</th><th>Off-type</th><th>Hama/penyakit</th><th>Kondisi</th><th>Hasil</th><th>Catatan</th></tr>' + ins.map(i => '<tr><td>' + fmtTgl(i.tanggal) + '</td><td>' + esc(i.tahap) + '</td><td class="kanan">' + fmtAngka(i.offtype, 0) + '</td><td>' + esc((i.hama || '-') + ' (' + (i.tingkatHama || '-') + ')') + '</td><td>' + esc(i.kondisi) + '</td><td>' + esc(i.hasil) + '</td><td>' + esc(i.catatan || '') + '</td></tr>').join('') + '</table>' : '<p class="muted">Belum ada.</p>') +
      '<h3>Panen</h3>' + (pan.length ? '<table><tr><th>Panen ke</th><th>Tanggal</th><th class="kanan">Berat (kg)</th><th>Catatan</th></tr>' + pan.map(x => '<tr><td>' + esc(x.panenKe) + '</td><td>' + fmtTgl(x.tanggal) + '</td><td class="kanan">' + fmtAngka(x.berat) + '</td><td>' + esc(x.catatan || '') + '</td></tr>').join('') + '</table>' : '<p class="muted">Belum ada.</p>');
  });
  buatPdf('Riwayat ' + p.kode + ' - ' + p.nama, bungkusPdf('Riwayat Petani Mitra: ' + p.nama, isi));
}
function pdfCapaian() {
  const d = data(), L = dataLaporan(d);
  const kf = S.filter.lapKom ? (d.by.Komoditas[S.filter.lapKom] || {}).nama : 'Semua komoditas';
  const th = S.filter.lapTahun || 'Semua tahun';
  let isi = '<div>Filter: ' + esc(kf) + ' · ' + esc(th) + '</div><h2>Ringkasan per komoditas</h2>' +
    '<table><tr><th>Komoditas</th><th class="kanan">Jumlah tanam</th><th class="kanan">Total target (kg)</th><th class="kanan">Total taksasi (kg)</th><th class="kanan">Sudah ada hasil</th><th class="kanan">Benih bersih (kg)</th><th class="kanan">Capaian</th></tr>' +
    L.ringkas.map(r => '<tr><td>' + esc(r.k.nama) + '</td><td class="kanan">' + r.n + '</td><td class="kanan">' + fmtAngka(r.target) + '</td><td class="kanan">' + fmtAngka(r.est) + '</td><td class="kanan">' + r.nSel + ' (' + r.tercapai + ' tercapai)</td><td class="kanan">' + fmtAngka(r.hasil) + '</td><td class="kanan">' + (r.pct !== null ? fmtAngka(r.pct, 1) + '%' : '-') + '</td></tr>').join('') + '</table>' +
    '<p class="muted">Capaian dihitung dari tanam yang sudah ada hasil benih bersih: total hasil ÷ total target tanam tersebut.</p>' +
    '<h2>Detail per kode tanam</h2><table><tr><th>Kode tanam</th><th>Petani</th><th>Varietas</th><th class="kanan">Luas (ha)</th><th class="kanan">Target (kg)</th><th class="kanan">Taksasi (kg)</th><th class="kanan">Benih bersih (kg)</th><th class="kanan">Capaian</th><th>Status</th></tr>' +
    L.rows.map(r => '<tr><td>' + esc(r.t.kode) + '</td><td>' + esc(namaPetani(r.t, d)) + '</td><td>' + esc(r.t.varietas || '-') + '</td><td class="kanan">' + fmtAngka(r.t.luas) + '</td><td class="kanan">' + fmtAngka(r.c.target) + '</td><td class="kanan">' + fmtAngka(r.c.est) + '</td><td class="kanan">' + fmtAngka(r.c.hasil) + '</td><td class="kanan ' + (r.c.status === 'Tercapai' ? 'ok' : r.c.status === 'Belum tercapai' ? 'no' : '') + '">' + (r.c.pct !== null ? fmtAngka(r.c.pct, 0) + '%' : '-') + '</td><td>' + esc(r.t.status === 'Gagal' ? 'Gagal' : r.c.status) + '</td></tr>').join('') + '</table>';
  buatPdf('Laporan Capaian Target - ' + kf + ' - ' + th, bungkusPdf('Laporan Capaian Target Benih', isi));
}

/* ====================== LOGIN & MULAI ====================== */
function layarLogin(pesan) {
  S.mulai = false;
  document.body.innerHTML = '<div class="login"><form class="kotak" onsubmit="masuk(event)"><div class="logo">🌱</div><h1>Kerjaan Jeky</h1><div class="muted">Masukkan password untuk melanjutkan.</div>' +
    (pesan ? '<div class="pesan">' + esc(pesan) + '</div>' : '<div style="height:14px"></div>') +
    '<label class="f"><span>Password</span><input type="password" name="pw" required autocomplete="current-password"></label>' +
    '<label class="cek"><input type="checkbox" onchange="this.form.pw.type=this.checked?\'text\':\'password\'"> Tampilkan password</label>' +
    '<button class="btn penuh" id="btnMasuk">Masuk</button><div class="salah" id="loginInfo"></div>' +
    (MODE_GAS ? '' : '<div class="muted" style="margin-top:14px;font-size:12.5px">Server: ' + esc(pendekUrl(S.server)) + ' · <span class="tautan" onclick="layarServer()">Ganti</span></div>') +
    '</form></div><div class="toast-wrap" id="toasts"></div>';
  setTimeout(() => { const i = $('[name=pw]'); if (i) i.focus(); }, 50);
}
function layarServer(pesan) {
  S.mulai = false;
  const n = jumlahMenunggu();
  if (!pesan && n && S.server) pesan = 'Perhatian: masih ada ' + n + ' data/foto belum terkirim ke server sekarang. Kirim dulu sebelum mengganti server.';
  document.body.innerHTML = '<div class="login"><form class="kotak" onsubmit="simpanServer(event)"><div class="logo">🌱</div><h1>Kerjaan Jeky</h1><div class="muted">Hubungkan aplikasi ke Google Sheets kamu.</div>' +
    (pesan ? '<div class="pesan">' + esc(pesan) + '</div>' : '<div style="height:14px"></div>') +
    '<label class="f"><span>Link server (URL aplikasi web)</span><textarea name="url" required rows="3" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" style="min-height:0;font-size:14px">' + esc(S.server || '') + '</textarea>' +
    '<div class="hint">Salin dari editor Apps Script: Terapkan → Kelola deployment → URL aplikasi web (berakhiran /exec).</div></label>' +
    '<button class="btn penuh" id="btnServer">Hubungkan</button><div class="salah" id="serverInfo"></div>' +
    (S.server && S.token ? '<div style="margin-top:12px;text-align:center"><span class="tautan" onclick="mulaiApp()">Batal</span></div>' : '') +
    '</form></div><div class="toast-wrap" id="toasts"></div>';
}
async function simpanServer(e) {
  e.preventDefault();
  const url = e.target.url.value.trim().replace(/\s+/g, '');
  const info = $('#serverInfo'), btn = $('#btnServer');
  if (!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(url)) { info.textContent = 'Link harus diawali https://script.google.com/ dan berakhiran /exec.'; return; }
  btn.disabled = true;
  btn.textContent = 'Menghubungkan…';
  info.textContent = '';
  try {
    const r = prosesHasil(await panggilServer('apiInfo', [], url));
    if (S.server !== url) {
      S.token = null;
      S.snap = null;
      S.cache = null;
      await Simpan.del('kv', 'token');
      await Simpan.del('kv', 'snap');
    }
    S.server = url;
    await Simpan.set('kv', 'server', url);
    if (S.token) { mulaiApp(); sinkron(false); return; }
    layarLogin(r.siap ? 'Server terhubung ✓ Silakan masuk.' : 'Server terhubung, tapi password belum diatur. Buka Google Sheets → menu Kerjaan Jeky → Atur / ganti password.');
  } catch (err) {
    info.textContent = err.offline
      ? (navigator.onLine ? 'Tidak bisa terhubung. Cek link-nya, pastikan Code.gs versi terbaru sudah diterapkan sebagai "Versi baru", dan akses deployment "Siapa saja".' : 'Tidak ada sinyal. Coba lagi saat ada internet.')
      : err.message;
    btn.disabled = false;
    btn.textContent = 'Hubungkan';
  }
}
async function gantiServer() {
  if (!await konfirmasi('Ganti link server? Kamu perlu login lagi setelahnya.', 'Ganti')) return;
  layarServer();
}
async function masuk(e) {
  e.preventDefault();
  const btn = $('#btnMasuk'), info = $('#loginInfo');
  btn.disabled = true;
  btn.textContent = 'Memeriksa…';
  info.textContent = '';
  try {
    const r = await panggil('apiLogin', e.target.pw.value);
    S.token = r.token;
    await Simpan.set('kv', 'token', r.token);
    mulaiApp();
    sinkron(false);
  } catch (err) {
    info.textContent = err.offline ? 'Tidak ada sinyal. Login butuh internet.' : err.message;
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
}
function sesiHabis() {
  if (!S.token) return;
  S.token = null;
  Simpan.del('kv', 'token');
  layarLogin('Sesi login berakhir. Silakan masuk lagi — data yang belum terkirim tetap aman di HP ini.');
}
function mulaiApp() {
  shell();
  S.mulai = true;
  S.stack = [{ nama: 'beranda', params: {} }];
  tampil();
}

let intervalSiap = false;
async function init() {
  await Simpan.buka();
  try {
    S.token = (await Simpan.get('kv', 'token')) || null;
    S.snap = (await Simpan.get('kv', 'snap')) || null;
    S.antre = ((await Simpan.semua('antre')) || []).sort((a, b) => a.seq - b.seq);
    ((await Simpan.semua('foto')) || []).forEach(f => { S.fotoLokal[f.id] = f; });
  } catch (e) { console.error(e); }
  if (!MODE_GAS) {
    try { S.server = (await Simpan.get('kv', 'server')) || null; } catch (e) { S.server = null; }
    daftarSW();
  }
  siapkanRiwayat();
  if (!intervalSiap) {
    intervalSiap = true;
    setInterval(() => { if (S.token && jumlahMenunggu()) sinkron(false); }, 45000);
    setInterval(() => { if (S.token) sinkron(false); }, 300000);
    window.addEventListener('online', () => { S.online = true; sinkron(false); });
    window.addEventListener('offline', () => { S.online = false; renderStatus(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token) sinkron(false); });
  }
  if (!MODE_GAS && !S.server) { layarServer(); return; }
  if (!S.token) { layarLogin(); return; }
  mulaiApp();
  sinkron(false);
}
init();
</script>
